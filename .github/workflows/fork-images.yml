# Fork-only: builds the backend and frontend images and pushes them to GHCR.
# Upstream publishes to Docker Hub from image-to-docker-hub.yml; this workflow
# leaves that one untouched so upstream merges stay conflict-free.
#
# Release a fork build by tagging the fork branch, e.g. `v0.31.0-mm.1`.
# Images: ghcr.io/<owner>/moneymatter-be and ghcr.io/<owner>/moneymatter-fe,
# tagged with the git tag and `sha-<short sha>`.

name: Fork images (GHCR)

on:
  push:
    tags: ['v*-mm.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'letehaha/moneymatter'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: moneymatter-be
            dockerfile: ./self-hosting/backend/Dockerfile
          - image: moneymatter-fe
            dockerfile: ./self-hosting/frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute tags
        id: meta
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          repo="ghcr.io/${OWNER,,}/${IMAGE}"
          sha="$(git rev-parse --short=7 HEAD)"
          {
            echo "sha=${sha}"
            echo "refs<<EOF"
            echo "${repo}:sha-${sha}"
            if [ "$REF_TYPE" = "tag" ]; then echo "${repo}:${REF_NAME}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.refs }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SENTRY_RELEASE=${{ steps.meta.outputs.sha }}
            VITE_SENTRY_RELEASE=${{ steps.meta.outputs.sha }}
            VITE_APP_COMMIT_HASH=${{ steps.meta.outputs.sha }}
